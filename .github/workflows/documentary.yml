name: Documentary Bot

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Documentary topic (ya 'auto' likho - Gemini khud topic chunega)"
        required: true
        default: "auto"
      minutes:
        description: "Video length in minutes (5-10)"
        required: true
        default: "7"
      privacy:
        description: "YouTube privacy"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  make-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages (ffmpeg + Hindi font)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run documentary bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TOPIC: ${{ github.event.inputs.topic }}
          MINUTES: ${{ github.event.inputs.minutes }}
          PRIVACY: ${{ github.event.inputs.privacy }}
        run: python documentary_bot.py

      - name: Save video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-output
          path: output/
          retention-days: 7
